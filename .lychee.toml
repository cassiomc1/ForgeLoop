# Execução determinística e limitada para documentação local e CI.
cache = true
max_cache_age = "1d"
max_retries = 2
retry_wait_time = 2
timeout = 20
no_progress = true

# Exemplos locais e endereços de loopback não são destinos publicáveis.
exclude_loopback = true
exclude = [
  '^https?://(?:www\.)?example\.(?:com|org|net)(?:/|$)',
  # Phaser responde 403 a automação; links mais específicos continuam verificados.
  '^https://phaser\.io/$',
]
