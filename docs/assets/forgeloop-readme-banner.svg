<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="700" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
  <title id="title">ForgeLoop — Verifiable Engineering Protocol</title>
  <desc id="desc">A dark technical banner showing the ForgeLoop lifecycle from request to validated completion, with evidence-backed verification and cross-harness continuity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#11182b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#60a5fa" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#60a5fa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.35" stop-color="#a78bfa"/>
      <stop offset="0.68" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#86efac"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.45" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000" flood-opacity="0.34"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowOrange" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#fb923c"/>
    </marker>
    <style>
      .ui { font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace; }
      .muted { fill:#94a3b8; }
      .dim { fill:#64748b; }
      .chipText { font-size:18px; font-weight:600; fill:#cbd5e1; letter-spacing:.2px; }
      .nodeTitle { font-size:17px; font-weight:700; fill:#f8fafc; }
      .nodeSub { font-size:13px; fill:#94a3b8; }
    </style>
  </defs>

  <rect width="1600" height="700" rx="34" fill="url(#bg)"/>
  <rect width="1600" height="700" rx="34" fill="none" stroke="#263247" stroke-width="2"/>
  <circle cx="1230" cy="288" r="390" fill="url(#glowA)"/>
  <circle cx="1380" cy="520" r="300" fill="url(#glowB)"/>

  <g opacity="0.16" stroke="#334155" stroke-width="1">
    <path d="M0 100H1600 M0 200H1600 M0 300H1600 M0 400H1600 M0 500H1600 M0 600H1600"/>
    <path d="M100 0V700 M200 0V700 M300 0V700 M400 0V700 M500 0V700 M600 0V700 M700 0V700 M800 0V700 M900 0V700 M1000 0V700 M1100 0V700 M1200 0V700 M1300 0V700 M1400 0V700 M1500 0V700"/>
  </g>

  <g class="ui" transform="translate(92 105)">
    <g transform="translate(0 0)">
      <rect x="0" y="0" width="56" height="56" rx="15" fill="#111827" stroke="#475569"/>
      <path d="M16 19h24v8H24v7h14v8H24v11h-8z" fill="url(#brand)"/>
      <path d="M43 17c8 7 8 22 0 29" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
      <path d="M45 42l-1 7 7-2" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="78" y="43" font-size="43" font-weight="800" fill="#f8fafc" letter-spacing="-1.4">Forge<tspan fill="url(#brand)">Loop</tspan></text>
    <text x="0" y="120" font-size="26" font-weight="700" fill="#e2e8f0">Verifiable Engineering Protocol</text>
    <text x="0" y="166" font-size="20" fill="#94a3b8">Turn AI-assisted development into a resumable,</text>
    <text x="0" y="198" font-size="20" fill="#94a3b8">evidence-backed engineering loop.</text>

    <g transform="translate(0 245)">
      <rect x="0" y="0" width="144" height="42" rx="21" fill="#0f172a" stroke="#334155"/>
      <circle cx="24" cy="21" r="5" fill="#7dd3fc"/>
      <text x="39" y="27" class="chipText">Portable</text>

      <rect x="158" y="0" width="184" height="42" rx="21" fill="#0f172a" stroke="#334155"/>
      <circle cx="182" cy="21" r="5" fill="#a78bfa"/>
      <text x="197" y="27" class="chipText">Vendor-neutral</text>

      <rect x="0" y="56" width="160" height="42" rx="21" fill="#0f172a" stroke="#334155"/>
      <circle cx="24" cy="77" r="5" fill="#5eead4"/>
      <text x="39" y="83" class="chipText">Resumable</text>

      <rect x="174" y="56" width="190" height="42" rx="21" fill="#0f172a" stroke="#334155"/>
      <circle cx="198" cy="77" r="5" fill="#86efac"/>
      <text x="213" y="83" class="chipText">Evidence-first</text>
    </g>

    <g transform="translate(0 400)">
      <text x="0" y="0" font-size="14" font-weight="700" fill="#64748b" letter-spacing="1.8">PROTOCOL, NOT AN AGENT RUNTIME</text>
      <path d="M0 20H455" stroke="#263247"/>
      <text x="0" y="56" class="mono" font-size="16" fill="#7dd3fc">request</text>
      <text x="74" y="56" class="mono" font-size="16" fill="#475569">/</text>
      <text x="100" y="56" class="mono" font-size="16" fill="#60a5fa">contract</text>
      <text x="181" y="56" class="mono" font-size="16" fill="#475569">/</text>
      <text x="207" y="56" class="mono" font-size="16" fill="#a78bfa">execute</text>
      <text x="280" y="56" class="mono" font-size="16" fill="#475569">/</text>
      <text x="306" y="56" class="mono" font-size="16" fill="#5eead4">evidence</text>
      <text x="388" y="56" class="mono" font-size="16" fill="#475569">/</text>
      <text x="414" y="56" class="mono" font-size="16" fill="#86efac">valid</text>
    </g>
  </g>

  <g transform="translate(760 64)" filter="url(#shadow)">
    <rect x="0" y="0" width="760" height="572" rx="30" fill="#0d1424" fill-opacity="0.94" stroke="#2a3850"/>

    <circle cx="32" cy="31" r="6" fill="#475569"/>
    <circle cx="52" cy="31" r="6" fill="#475569"/>
    <circle cx="72" cy="31" r="6" fill="#475569"/>
    <text x="108" y="37" class="mono" font-size="13" fill="#64748b">forgeloop / protocol-state</text>
    <line x1="0" y1="58" x2="760" y2="58" stroke="#263247"/>

    <ellipse cx="382" cy="312" rx="253" ry="190" fill="none" stroke="#60a5fa" stroke-opacity="0.09" stroke-width="52" filter="url(#soft)"/>

    <path d="M198 185 C265 114 386 92 494 128 C595 162 646 242 638 329 C631 411 562 478 472 503 C365 533 245 503 188 429 C131 355 141 257 198 185Z"
          fill="none" stroke="url(#loop)" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 12"/>

    <path d="M535 446 C610 432 675 377 687 302" fill="none" stroke="#fb923c" stroke-width="3" stroke-dasharray="7 8" marker-end="url(#arrowOrange)"/>
    <text x="553" y="416" class="ui" font-size="11" font-weight="700" fill="#fb923c">RECOVER / RECHECK</text>

    <g transform="translate(266 278)">
      <rect x="0" y="0" width="234" height="92" rx="22" fill="#111827" stroke="#475569"/>
      <text x="117" y="31" text-anchor="middle" class="ui" font-size="13" font-weight="800" fill="#94a3b8" letter-spacing="1.1">CROSS-HARNESS</text>
      <text x="117" y="55" text-anchor="middle" class="ui" font-size="19" font-weight="750" fill="#f8fafc">Continuity State</text>
      <text x="117" y="76" text-anchor="middle" class="mono" font-size="12" fill="#5eead4">resume • reconcile • next</text>
    </g>

    <g class="ui" transform="translate(109 150)">
      <rect width="162" height="76" rx="18" fill="#1f2937" stroke="#7dd3fc" stroke-width="2"/>
      <circle cx="25" cy="25" r="7" fill="#7dd3fc"/>
      <text x="43" y="30" class="nodeTitle">Request</text>
      <text x="20" y="55" class="nodeSub">intent + discovery</text>
    </g>

    <g class="ui" transform="translate(335 91)">
      <rect width="174" height="78" rx="18" fill="#171f3f" stroke="#60a5fa" stroke-width="2"/>
      <path d="M23 18h12l8 8v19H23z" fill="none" stroke="#60a5fa" stroke-width="2"/>
      <path d="M35 18v9h8" fill="none" stroke="#60a5fa" stroke-width="2"/>
      <text x="57" y="31" class="nodeTitle">Contract</text>
      <text x="20" y="57" class="nodeSub">route + preflight</text>
    </g>

    <g class="ui" transform="translate(553 190)">
      <rect width="160" height="78" rx="18" fill="#312e81" stroke="#a78bfa" stroke-width="2"/>
      <path d="M22 22l13 8-13 8z" fill="#a78bfa"/>
      <text x="49" y="31" class="nodeTitle">Execute</text>
      <text x="20" y="57" class="nodeSub">deterministic state</text>
    </g>

    <g class="ui" transform="translate(530 387)">
      <rect width="183" height="82" rx="18" fill="#134e4a" stroke="#5eead4" stroke-width="2"/>
      <path d="M22 34l7 7 15-17" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="55" y="33" class="nodeTitle">Evidence</text>
      <text x="20" y="59" class="nodeSub">checks + provenance</text>
    </g>

    <g class="ui" transform="translate(279 465)">
      <rect width="184" height="78" rx="18" fill="#14532d" stroke="#86efac" stroke-width="2"/>
      <path d="M22 26l6 6 12-14" fill="none" stroke="#86efac" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="31" cy="29" r="17" fill="none" stroke="#86efac" stroke-width="2"/>
      <text x="58" y="31" class="nodeTitle">VALID</text>
      <text x="20" y="57" class="nodeSub">validator-backed done</text>
    </g>

    <g class="ui" transform="translate(66 361)">
      <rect width="179" height="82" rx="18" fill="#451a03" stroke="#fb923c" stroke-width="2"/>
      <path d="M22 23h18M22 31h13M22 39h16" stroke="#fb923c" stroke-width="2" stroke-linecap="round"/>
      <text x="54" y="33" class="nodeTitle">Review</text>
      <text x="20" y="60" class="nodeSub">drift / rejection loop</text>
    </g>

    <path d="M276 130 C292 116 305 109 319 104" fill="none" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arrowBlue)"/>

  </g>

  <g class="mono" transform="translate(92 655)">
    <text font-size="13" fill="#475569">github.com/cassiomc1/forgeloop</text>
  </g>
</svg>
