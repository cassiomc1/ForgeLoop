<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="920" viewBox="0 0 1490 920" role="img" aria-labelledby="title desc"><title id="title">ForgeLoop — Loop Engineering for AI Agents</title><desc id="desc">ForgeLoop engineering architecture showing Brief, Route, Execute, Verify, and Continue in a resumable verification loop with task state, policy checks, artifacts, and cross-harness continuity.</desc><rect width="1490" height="920" rx="24" fill="#050912"/><text x="745" y="120" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="82" font-weight="800">ForgeLoop</text><text x="745" y="165" text-anchor="middle" fill="#aebed4" font-family="Arial,sans-serif" font-size="30">Loop Engineering for AI Agents</text><circle cx="745" cy="500" r="240" fill="none" stroke="#2ccfff" stroke-width="8"/><circle cx="745" cy="305" r="52" fill="#0b1f3d" stroke="#2ccfff" stroke-width="3"/><circle cx="1010" cy="465" r="52" fill="#0b1f3d" stroke="#2ccfff" stroke-width="3"/><circle cx="915" cy="705" r="52" fill="#26180c" stroke="#ff9d2e" stroke-width="3"/><circle cx="560" cy="675" r="52" fill="#18122f" stroke="#9a63ff" stroke-width="3"/><circle cx="485" cy="465" r="52" fill="#0b1f3d" stroke="#2ccfff" stroke-width="3"/><text x="745" y="312" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18">Brief</text><text x="1010" y="472" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18">Route</text><text x="915" y="712" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18">Execute</text><text x="560" y="682" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18">Verify</text><text x="485" y="472" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="18">Continue</text><polygon points="745,410 820,455 820,545 745,590 670,545 670,455" fill="#0b1630" stroke="#315ec9" stroke-width="2"/><text x="745" y="485" text-anchor="middle" fill="#c9d8eb" font-family="Arial,sans-serif" font-size="18">Deterministic</text><text x="745" y="512" text-anchor="middle" fill="#c9d8eb" font-family="Arial,sans-serif" font-size="18">Resumable</text><text x="745" y="539" text-anchor="middle" fill="#c9d8eb" font-family="Arial,sans-serif" font-size="18">Verifiable</text><rect x="45" y="255" width="260" height="170" rx="16" fill="#091424" stroke="#2a6ca8"/><text x="70" y="292" fill="#d9edff" font-family="monospace" font-size="16">BRIEF.md</text><text x="70" y="326" fill="#7dcfff" font-family="monospace" font-size="13">goal: ship feature</text><text x="70" y="351" fill="#9cb0c8" font-family="monospace" font-size="13">constraints:</text><text x="82" y="376" fill="#9cb0c8" font-family="monospace" font-size="13">- reproducible</text><rect x="45" y="450" width="260" height="170" rx="16" fill="#091424" stroke="#2a6ca8"/><text x="70" y="487" fill="#d9edff" font-family="monospace" font-size="16">TASK STATE</text><text x="70" y="522" fill="#9cb0c8" font-family="monospace" font-size="13">status: in_progress</text><text x="70" y="547" fill="#9cb0c8" font-family="monospace" font-size="13">phase: VERIFYING</text><rect x="1185" y="255" width="260" height="170" rx="16" fill="#091424" stroke="#315d9a"/><text x="1210" y="292" fill="#d9edff" font-family="monospace" font-size="16">ROUTER POLICY</text><text x="1210" y="326" fill="#7dcfff" font-family="monospace" font-size="13">allow: scoped tools</text><text x="1210" y="351" fill="#9cb0c8" font-family="monospace" font-size="13">deny: unsafe writes</text><rect x="1185" y="450" width="260" height="170" rx="16" fill="#091424" stroke="#315d9a"/><text x="1210" y="487" fill="#d9edff" font-family="monospace" font-size="16">POLICY CHECK</text><text x="1210" y="522" fill="#63e6a6" font-family="monospace" font-size="13">✓ tests pass</text><text x="1210" y="547" fill="#63e6a6" font-family="monospace" font-size="13">✓ policy valid</text><text x="1210" y="575" fill="#63e6a6" font-family="monospace" font-size="13">result: PASSED</text><rect x="330" y="805" width="830" height="78" rx="16" fill="#091424" stroke="#284f83"/><text x="745" y="835" text-anchor="middle" fill="#9fb1cc" font-family="Arial,sans-serif" font-size="13">CROSS-HARNESS CONTINUITY</text><text x="410" y="863" fill="#dcecff" font-family="Arial,sans-serif" font-size="14">Local Dev → CI → Remote Runner → Another Harness → state resumed</text></svg>