name: Docs quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test npm CLI
        run: npm test

      - name: Verify npm package contents
        run: npm run pack:check

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0

      - name: Check links
        # Link checking is independent of the Node matrix; avoid three
        # simultaneous requests to rate-limited reference hosts.
        if: matrix.node-version == 24
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --config .lychee.toml './**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Markdown
        run: |
          python3 -m unittest tests.test_validate_markdown -v
          python3 scripts/validate_markdown.py --self-test
          python3 scripts/validate_markdown.py
      - name: Validate universal project loop
        run: |
          python3 -m unittest tests.test_validate_loop_system -v
          python3 scripts/validate_loop_system.py --self-test
          python3 scripts/validate_loop_system.py

      - name: Scan repository for secrets
        run: python3 -m unittest tests.test_scan_secrets -v && python3 scripts/scan_secrets.py

  cli-portability:
    name: CLI portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 20
        uses: actions/setup-node@49933a5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Test npm CLI and portability fixtures
        run: npm test

      - name: Verify npm package contents
        run: npm run pack:check
