name: ForgeLoop audit

on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Audit ForgeLoop receipt
        if: ${{ hashFiles('.forgeloop/execution-receipt.json') != '' }}
        run: npx @cassiomc1/forgeloop audit --strict
