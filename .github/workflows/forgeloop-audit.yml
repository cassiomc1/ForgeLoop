name: ForgeLoop audit

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
      - name: Install locked Node toolchain
        run: npm ci --ignore-scripts
      - name: Audit ForgeLoop receipt
        if: ${{ hashFiles('.forgeloop/execution-receipt.json') != '' }}
        run: node src/cli.js audit --strict
      - name: Discover task-scoped ForgeLoop receipts
        id: receipts
        run: |
          count=$(find .forgeloop/task-state -name execution-receipt.json -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
      - name: Audit task-scoped ForgeLoop receipts
        if: ${{ steps.receipts.outputs.count != '0' }}
        run: node src/cli.js audit --strict
    timeout-minutes: 15
