name: Package smoke

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tarball-smoke:
    name: tarball smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run mcp:setup
      - run: npm run mcp:test
      - run: npm run mcp:pack:check
      - run: npm run pack:smoke
